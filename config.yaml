data:
  start_date: "2015-01-01"
  end_date: "2024-12-31"
  cache_dir: "data/cache"
  sp500_url: "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies"

features:
  momentum_windows: [1, 3, 6, 12]
  volatility_window: 12

model:
  target_col: "target_excess"
  min_train_months: 24
  retrain_freq: 3          # retrain every N months
  lgbm:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 4
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    random_state: 42
    verbose: -1

backtest:
  initial_capital: 100000
  top_n: 30
  transaction_cost: 0.001  # 0.1% round-trip per position
